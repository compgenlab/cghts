name: Test

on:
  pull_request:
  push:
    branches:
      - main

# Read-only: this only checks code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The Makefile exports GOWORK=off so the library always builds standalone,
    # whatever go.work sits above it on a developer's machine; CI does the same.
    env:
      GOWORK: "off"
      GOCACHE: /tmp/go-build-cache

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The SAM/BAM/CRAM tests compare against samtools (and CRAM reading uses
      # it); without it those tests fail rather than skip.
      - name: Install samtools
        run: sudo apt-get update && sudo apt-get install -y samtools

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...
